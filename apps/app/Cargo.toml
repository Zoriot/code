[package]
name = "theseus_gui"
# The actual version is set by the theseus-build workflow on tagging
version = "1.0.0-local"
edition.workspace = true
description = "The Modrinth App is a desktop application for managing your Minecraft mods"
repository = "https://github.com/modrinth/code/apps/app/"
license = "GPL-3.0-only"

[dependencies]
async_zip = { workspace = true, features = ["deflate", "tokio-fs"] }
chrono = { workspace = true }
daedalus = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
enumset = { workspace = true, features = ["serde"] }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
native-dialog = { workspace = true }
paste = { workspace = true }
path-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
tauri-plugin-deep-link = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef", default-features = false, features = ["xdg-portal"] }

tauri-plugin-fs = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-http = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-opener = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-os = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-single-instance = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}

tauri-plugin-window-state = {
	git = "https://github.com/tauri-apps/plugins-workspace",
	branch = "feat/cef"
}
tauri-plugin-updater = { workspace = true }
tauri-runtime-cef = { workspace = true, features = [
	"devtools",
	"macos-private-api",
] }
theseus = { workspace = true, features = ["tauri"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dependencies.tauri]
workspace = true
default-features = false
features = [
	"protocol-asset",
	"macos-private-api",
]
[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true
objc2-app-kit = { workspace = true, features = ["NSWindow"] }

[target."cfg(windows)".dependencies]
webview2-com.workspace = true
windows-core.workspace = true

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
export-app-events = ["theseus/export-ts"]
updater = []

[lints]
workspace = true
